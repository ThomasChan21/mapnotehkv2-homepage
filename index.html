<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MapNoteHK</title>
  <meta name="description" content="MapNoteHK — map notes for Hong Kong property professionals." />
  <meta property="og:title" content="MapNoteHK" />
  <meta property="og:image" content="./assets/og-image.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/site.css" />
</head>
<body data-title-key="meta.homeTitle" data-desc-key="meta.homeDesc">
  <a class="skip-link" href="#main">Skip</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="hero" aria-label="Hero">
      <div class="container hero-inner">
        <p class="brand-mark">MapNoteHK</p>
        <h1 data-i18n="home.heroTitle"></h1>
        <p class="hero-lead" data-i18n="home.heroLead"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="./contact/" data-i18n="home.ctaPrimary"></a>
          <a class="btn btn-secondary" href="./services/" data-i18n="home.ctaSecondary"></a>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="home.quickTitle"></h2>
        </div>
        <div class="quick-grid">
          <article class="panel">
            <a class="block-link" href="./services/">
              <h3 data-i18n="home.quickServices"></h3>
              <p data-i18n="home.quickServicesDesc"></p>
            </a>
          </article>
          <article class="panel">
            <a class="block-link" href="./about/">
              <h3 data-i18n="home.quickAbout"></h3>
              <p data-i18n="home.quickAboutDesc"></p>
            </a>
          </article>
          <article class="panel">
            <a class="block-link" href="./contact/">
              <h3 data-i18n="home.quickContact"></h3>
              <p data-i18n="home.quickContactDesc"></p>
            </a>
          </article>
          <article class="panel">
            <a class="block-link" href="./privacy/">
              <h3 data-i18n="home.quickPrivacy"></h3>
              <p data-i18n="home.quickPrivacyDesc"></p>
            </a>
          </article>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script>
    window.MapNotePage = { base: './', active: 'home' };
  </script>
  <script src="./js/site-config.js"></script>
  <script src="./js/i18n.js"></script>
  <script src="./js/chrome.js"></script>
  <script src="./js/site.js"></script>
</body>
</html>
