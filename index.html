<!DOCTYPE html>

  <meta property="og:title" content="MapNoteHK 地圖筆記" />

  <link rel="stylesheet" href="./css/site.css?v=20260823c" />
  <!-- Favicon: pin+map brand mark — ICO fallback + PNG tabs + Apple/PWA icons -->
  <link rel="icon" href="./assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png" />

<body data-title-key="meta.homeTitle" data-desc-key="meta.homeDesc">
  <a class="skip-link" href="#main">Skip</a>

  <main id="main">
    <!-- Hero: launch announcement + app screenshot + download/feature CTAs -->
    <section class="hero" aria-label="Hero">
      <div class="container hero-grid">
        <div class="hero-copy">
          <p class="hero-badge"><span class="hero-badge-dot" aria-hidden="true"></span><span data-i18n="home.heroBadge"></span></p>
          <!-- Pain hook from the poster: a question line above the brand H1 -->
          <p class="hero-pain" data-i18n="home.heroPain"></p>
          <h1 data-i18n="home.heroTitle"></h1>
          <p class="hero-lead" data-i18n="home.heroLead"></p>
          <!-- site.js swaps these text CTAs for store badges when storeLinks are configured.
               Pre-launch, the secondary CTA scrolls to the launch-notify band. -->
          <div class="hero-actions" id="hero-actions">
            <a class="btn btn-primary" href="#features" data-i18n="home.ctaPrimary"></a>
            <a class="btn btn-secondary" href="#notify-section" data-i18n="home.ctaSecondary"></a>
          </div>
          <!-- PRD proof points under the CTAs: quick capture, five types, FAQ base, trilingual -->
          <ul class="hero-stats">
            <li><strong data-i18n="home.stat1Value"></strong><span data-i18n="home.stat1Label"></span></li>
            <li><strong data-i18n="home.stat2Value"></strong><span data-i18n="home.stat2Label"></span></li>
            <li><strong data-i18n="home.stat3Value"></strong><span data-i18n="home.stat3Label"></span></li>
            <li><strong data-i18n="home.stat4Value"></strong><span data-i18n="home.stat4Label"></span></li>
          </ul>
        </div>
        <!-- App demo loop in place of a static screenshot: muted autoplay is required for mobile -->
        <div class="hero-shot">
          <video
            class="hero-video"
            poster="./assets/video-sample-1-poster.jpg"
            width="1080"
            height="1080"
            autoplay
            muted
            loop
            playsinline
            preload="metadata"
            data-i18n-aria-label="home.heroVideoAria"
            aria-label="MapNoteHK app demo"
          >
            <source src="./assets/video-sample-1-square.webm" type="video/webm" />
            <source src="./assets/video-sample-1-square.mp4" type="video/mp4" />
          </video>
        </div>
      </div>
    </section>

    <!-- Pain points: the poster's PAS framing — name the three daily pains
         (PRD §E persona), each card resolving to the feature that removes it -->
    <section class="section pains" aria-label="Pain points">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="home.painsTitle"></h2>
          <p data-i18n="home.painsLead"></p>
        </div>
        <div class="pains-grid">
          <article class="pain-card">
            <span class="pain-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-9 9H7V9h4v2zm6 0h-4V9h4v2z" /></svg>
            </span>
            <h3 data-i18n="home.pain1Title"></h3>
            <p data-i18n="home.pain1Body"></p>
            <p class="pain-solution" data-i18n="home.pain1Solution"></p>
          </article>
          <article class="pain-card">
            <span class="pain-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" /></svg>

            <p class="pain-solution" data-i18n="home.pain3Solution"></p>
          </article>
        </div>
      </div>
    </section>

            <p data-i18n="home.type2Body"></p>

              <svg viewBox="0 0 24 24" focusable="false"><path d="M12 12c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z" /></svg>

            <span class="type-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58s1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z" /></svg>

            <p data-i18n="home.type4Body"></p>
          </article>
          <article class="type-card" style="--tc: #b45309">
            <span class="type-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z" /></svg>
            </span>
            <h3 data-i18n="home.type5Title"></h3>
            <p data-i18n="home.type5Body"></p>
          </article>
        </div>
      </div>
    </section>

    <!-- Feature showcase: real app screenshots, alternating rows -->
    <section class="section" id="features" aria-label="Features">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="home.featuresTitle"></h2>
          <p data-i18n="home.featuresLead"></p>
        </div>

        <!-- Feature switcher: pick a feature on the left, see the full app
             screenshot on the right. All five titles stay visible; one tap
             swaps the screenshot — nothing is cropped away. -->
        <div class="showcase" id="feature-showcase">
          <div class="showcase-list" role="tablist" data-i18n-aria-label="home.showcaseLabel" aria-label="App features">
            <!-- Planning intelligence leads: the 90% survey-scoring feature
                 (progress report Slide 11) opens the showcase, not map notes -->
            <button type="button" class="showcase-item is-active" role="tab" id="tab-f2" aria-controls="panel-f2" aria-selected="true">
              <span class="showcase-item-head">
                <span class="tag tag-mix" data-i18n="home.tagFreePremium"></span>
                <span class="showcase-item-title" data-i18n="home.f2Title"></span>
              </span>
              <span class="showcase-item-body" data-i18n="home.f2Body"></span>
            </button>
            <button type="button" class="showcase-item" role="tab" id="tab-f1" aria-controls="panel-f1" aria-selected="false" tabindex="-1">
              <span class="showcase-item-head">
                <span class="tag tag-free" data-i18n="home.tagFree"></span>
                <span class="showcase-item-title" data-i18n="home.f1Title"></span>
              </span>
              <span class="showcase-item-body" data-i18n="home.f1Body"></span>

            <button type="button" class="showcase-item" role="tab" id="tab-f3" aria-controls="panel-f3" aria-selected="false" tabindex="-1">

              </span>
              <span class="showcase-item-body" data-i18n="home.f3Body"></span>
            </button>
            <button type="button" class="showcase-item" role="tab" id="tab-f4" aria-controls="panel-f4" aria-selected="false" tabindex="-1">
              <span class="showcase-item-head">
                <span class="tag tag-mix" data-i18n="home.tagFreePremium"></span>
                <span class="showcase-item-title" data-i18n="home.f4Title"></span>
              </span>
              <span class="showcase-item-body" data-i18n="home.f4Body"></span>
            </button>
            <button type="button" class="showcase-item" role="tab" id="tab-f5" aria-controls="panel-f5" aria-selected="false" tabindex="-1">
              <span class="showcase-item-head">
                <span class="tag tag-premium" data-i18n="home.tagPremium"></span>
                <span class="showcase-item-title" data-i18n="home.f5Title"></span>
              </span>
              <span class="showcase-item-body" data-i18n="home.f5Body"></span>
            </button>
          </div>

                </picture>
                <picture class="phone-frame">
                  <source type="image/webp" srcset="./assets/feature-planning-detail-280.webp 280w, ./assets/feature-planning-detail-460.webp 460w" sizes="(max-width: 860px) 42vw, 240px" />

                </picture>
              </div>
            </div>
            <div class="showcase-panel" role="tabpanel" id="panel-f1" aria-labelledby="tab-f1" hidden>
              <!-- Map note + layer overlays: two phone captures side by side -->
              <div class="showcase-duo">
                <picture class="phone-frame">
                  <source type="image/webp" srcset="./assets/feature-map-280.webp 280w, ./assets/feature-map-460.webp 460w" sizes="(max-width: 860px) 42vw, 240px" />
                  <img src="./assets/feature-map-460.png" srcset="./assets/feature-map-280.png 280w, ./assets/feature-map-460.png 460w" sizes="(max-width: 860px) 42vw, 240px" width="460" height="1024" data-i18n-alt="home.f1Alt" alt="" loading="lazy" decoding="async" />
                </picture>
                <picture class="phone-frame">
                  <source type="image/webp" srcset="./assets/feature-overlay-280.webp 280w, ./assets/feature-overlay-460.webp 460w" sizes="(max-width: 860px) 42vw, 240px" />

                </picture>
              </div>
            </div>
            <div class="showcase-panel" role="tabpanel" id="panel-f3" aria-labelledby="tab-f3" hidden>
              <!-- Notes: searchable list + note detail with attachments, side by side -->
              <div class="showcase-duo">
                <picture class="phone-frame">
                  <source type="image/webp" srcset="./assets/feature-media-list-280.webp 280w, ./assets/feature-media-list-460.webp 460w" sizes="(max-width: 860px) 42vw, 240px" />
                  <img src="./assets/feature-media-list-460.png" srcset="./assets/feature-media-list-280.png 280w, ./assets/feature-media-list-460.png 460w" sizes="(max-width: 860px) 42vw, 240px" width="460" height="1024" data-i18n-alt="home.f3Alt" alt="" loading="lazy" decoding="async" />
                </picture>
                <picture class="phone-frame">
                  <source type="image/webp" srcset="./assets/feature-media-detail-280.webp 280w, ./assets/feature-media-detail-460.webp 460w" sizes="(max-width: 860px) 42vw, 240px" />
                  <img src="./assets/feature-media-detail-460.png" srcset="./assets/feature-media-detail-280.png 280w, ./assets/feature-media-detail-460.png 460w" sizes="(max-width: 860px) 42vw, 240px" width="460" height="1024" data-i18n-alt="home.f3bAlt" alt="" loading="lazy" decoding="async" />

            </div>
            <div class="showcase-panel" role="tabpanel" id="panel-f4" aria-labelledby="tab-f4" hidden>
              <!-- AI expert: comparables answer with sources + pricing advice pair -->
              <div class="showcase-duo">

              <!-- Real generated brochure: cover + photo gallery shown as a page pair -->
              <div class="showcase-duo showcase-duo-paper">
                <picture>
                  <source type="image/webp" srcset="./assets/feature-pdf-p1-320.webp 320w, ./assets/feature-pdf-p1-640.webp 640w" sizes="(max-width: 860px) 42vw, 283px" />
                  <img src="./assets/feature-pdf-p1-640.png" srcset="./assets/feature-pdf-p1-320.png 320w, ./assets/feature-pdf-p1-640.png 640w" sizes="(max-width: 860px) 42vw, 283px" width="640" height="905" data-i18n-alt="home.f5AltP1" alt="" loading="lazy" decoding="async" />
                </picture>
                <picture>
                  <source type="image/webp" srcset="./assets/feature-pdf-p2-320.webp 320w, ./assets/feature-pdf-p2-640.webp 640w" sizes="(max-width: 860px) 42vw, 283px" />
                  <img src="./assets/feature-pdf-p2-640.png" srcset="./assets/feature-pdf-p2-320.png 320w, ./assets/feature-pdf-p2-640.png 640w" sizes="(max-width: 860px) 42vw, 283px" width="640" height="905" data-i18n-alt="home.f5AltP2" alt="" loading="lazy" decoding="async" />
                </picture>

    <!-- Plans: Free vs Premium summary, details on the services page -->
    <section class="section plans" aria-label="Plans">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="home.plansTitle"></h2>
          <p data-i18n="home.plansLead"></p>
        </div>
        <div class="plans-grid">
          <article class="plan-card">
            <h3 data-i18n="home.plansFreeTitle"></h3>
            <p class="plan-price" data-i18n="home.plansFreePrice"></p>
            <p data-i18n="home.plansFreeBody"></p>
          </article>
          <article class="plan-card is-premium">
            <h3 data-i18n="home.plansProTitle"></h3>
            <p class="plan-price" data-i18n="home.plansProPrice"></p>
            <p data-i18n="home.plansProBody"></p>
          </article>
        </div>
        <div class="plans-actions">
          <a class="btn btn-secondary" href="./services/" data-i18n="home.plansCta"></a>
        </div>
      </div>
    </section>

    <!-- Launch notify band: pre-launch conversion capture. Shown by site.js
         only while storeLinks are empty; the download band replaces it once
         the App Store / Google Play badges go live. -->
    <section class="notify" id="notify-section" aria-label="Launch notification" hidden>
      <div class="container notify-inner">
        <h2 data-i18n="home.notifyTitle"></h2>
        <p data-i18n="home.notifyBody"></p>
        <form class="notify-form" id="notify-form" novalidate>
          <label class="sr-only" for="notify-email" data-i18n="home.notifyEmailLabel"></label>
          <input id="notify-email" name="email" type="email" autocomplete="email" data-i18n-placeholder="home.notifyEmailPh" />
          <button class="btn btn-primary" type="submit" data-i18n="home.notifySubmit"></button>
        </form>
        <p class="form-status" id="notify-form-status" hidden></p>
        <p class="notify-note" data-i18n="home.notifyNote"></p>
      </div>
    </section>

    <!-- Download band: only shown by site.js when storeLinks are configured -->
    <section class="download" id="download-section" hidden>
      <div class="container download-inner">
        <h2 data-i18n="home.downloadTitle"></h2>
        <p data-i18n="home.downloadBody"></p>
        <div class="store-badges" id="download-badges"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script>
    window.MapNotePage = { base: './', active: 'home' };

  <script src="./js/site.js?v=20260823a"></script>
