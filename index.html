<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MapNoteHK 地圖筆記｜香港地產代理的地圖筆記 App</title>
  <meta name="description" content="MapNoteHK 正式登場：物業、考察、客戶、報價、成交五類筆記標記在香港官方地圖上，配合規劃申請圖層、廣東話語音輸入、AI 整理與 PDF 簡報。" />
  <meta property="og:title" content="MapNoteHK 地圖筆記" />
  <meta property="og:image" content="./assets/og-image.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/site.css?v=20260815f" />
</head>
<body data-title-key="meta.homeTitle" data-desc-key="meta.homeDesc">
  <a class="skip-link" href="#main">Skip</a>
  <div id="site-header"></div>

  <main id="main">
    <!-- Hero: launch announcement + app screenshot + download/feature CTAs -->
    <section class="hero" aria-label="Hero">
      <div class="container hero-grid">
        <div class="hero-copy">
          <p class="hero-badge"><span class="hero-badge-dot" aria-hidden="true"></span><span data-i18n="home.heroBadge"></span></p>
          <h1 data-i18n="home.heroTitle"></h1>
          <p class="hero-lead" data-i18n="home.heroLead"></p>
          <!-- site.js swaps these text CTAs for store badges when storeLinks are configured -->
          <div class="hero-actions" id="hero-actions">
            <a class="btn btn-primary" href="#features" data-i18n="home.ctaPrimary"></a>
            <a class="btn btn-secondary" href="./contact/" data-i18n="home.ctaSecondary"></a>
          </div>
        </div>
        <!-- App demo loop in place of a static screenshot: muted autoplay is required for mobile -->
        <div class="hero-shot">
          <video
            class="hero-video"
            poster="./assets/video-sample-1-poster.jpg"
            width="1080"
            height="1080"
            autoplay
            muted
            loop
            playsinline
            preload="metadata"
            data-i18n-aria-label="home.heroVideoAria"
            aria-label="MapNoteHK app demo"
          >
            <source src="./assets/video-sample-1-square.webm" type="video/webm" />
            <source src="./assets/video-sample-1-square.mp4" type="video/mp4" />
          </video>
        </div>
      </div>
    </section>

    <!-- Five note types: colours match the in-app legend (brand guidelines) -->
    <section class="section types" aria-label="Note types">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="home.typesTitle"></h2>
          <p data-i18n="home.typesLead"></p>
        </div>
        <div class="types-grid">
          <article class="type-card" style="--tc: #0369a1">
            <span class="type-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M4 20V9l8-5 8 5v11H4zm2-2h4v-5H6v5zm6 0h4v-8h-4v8z" /></svg>
            </span>
            <h3 data-i18n="home.type1Title"></h3>
            <p data-i18n="home.type1Body"></p>
          </article>
          <article class="type-card" style="--tc: #228b3b">
            <span class="type-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M12 5C8.1 5 5 8.1 5 12s3.1 7 7 7 7-3.1 7-7-3.1-7-7-7zm0 11c-2.2 0-4-1.8-4-4s1.8-4 4-4 4 1.8 4 4-1.8 4-4 4zm0-6.5c-1.4 0-2.5 1.1-2.5 2.5S10.6 14.5 12 14.5s2.5-1.1 2.5-2.5S13.4 9.5 12 9.5z" /></svg>
            </span>
            <h3 data-i18n="home.type2Title"></h3>
            <p data-i18n="home.type2Body"></p>
          </article>
          <article class="type-card" style="--tc: #4f46e5">
            <span class="type-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M12 12c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z" /></svg>
            </span>
            <h3 data-i18n="home.type3Title"></h3>
            <p data-i18n="home.type3Body"></p>
          </article>
          <article class="type-card" style="--tc: #0d9488">
            <span class="type-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58s1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z" /></svg>
            </span>
            <h3 data-i18n="home.type4Title"></h3>
            <p data-i18n="home.type4Body"></p>
          </article>
          <article class="type-card" style="--tc: #b45309">
            <span class="type-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z" /></svg>
            </span>
            <h3 data-i18n="home.type5Title"></h3>
            <p data-i18n="home.type5Body"></p>
          </article>
        </div>
      </div>
    </section>

    <!-- Feature showcase: real app screenshots, alternating rows -->
    <section class="section" id="features" aria-label="Features">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="home.featuresTitle"></h2>
          <p data-i18n="home.featuresLead"></p>
        </div>

        <!-- Feature switcher: pick a feature on the left, see the full app
             screenshot on the right. All five titles stay visible; one tap
             swaps the screenshot — nothing is cropped away. -->
        <div class="showcase" id="feature-showcase">
          <div class="showcase-list" role="tablist" data-i18n-aria-label="home.showcaseLabel" aria-label="App features">
            <button type="button" class="showcase-item is-active" role="tab" id="tab-f1" aria-controls="panel-f1" aria-selected="true">
              <span class="showcase-item-head">
                <span class="tag tag-free" data-i18n="home.tagFree"></span>
                <span class="showcase-item-title" data-i18n="home.f1Title"></span>
              </span>
              <span class="showcase-item-body" data-i18n="home.f1Body"></span>
            </button>
            <button type="button" class="showcase-item" role="tab" id="tab-f2" aria-controls="panel-f2" aria-selected="false" tabindex="-1">
              <span class="showcase-item-head">
                <span class="tag tag-mix" data-i18n="home.tagFreePremium"></span>
                <span class="showcase-item-title" data-i18n="home.f2Title"></span>
              </span>
              <span class="showcase-item-body" data-i18n="home.f2Body"></span>
            </button>
            <button type="button" class="showcase-item" role="tab" id="tab-f3" aria-controls="panel-f3" aria-selected="false" tabindex="-1">
              <span class="showcase-item-head">
                <span class="tag tag-free" data-i18n="home.tagFree"></span>
                <span class="showcase-item-title" data-i18n="home.f3Title"></span>
              </span>
              <span class="showcase-item-body" data-i18n="home.f3Body"></span>
            </button>
            <button type="button" class="showcase-item" role="tab" id="tab-f4" aria-controls="panel-f4" aria-selected="false" tabindex="-1">
              <span class="showcase-item-head">
                <span class="tag tag-mix" data-i18n="home.tagFreePremium"></span>
                <span class="showcase-item-title" data-i18n="home.f4Title"></span>
              </span>
              <span class="showcase-item-body" data-i18n="home.f4Body"></span>
            </button>
            <button type="button" class="showcase-item" role="tab" id="tab-f5" aria-controls="panel-f5" aria-selected="false" tabindex="-1">
              <span class="showcase-item-head">
                <span class="tag tag-premium" data-i18n="home.tagPremium"></span>
                <span class="showcase-item-title" data-i18n="home.f5Title"></span>
              </span>
              <span class="showcase-item-body" data-i18n="home.f5Body"></span>
            </button>
          </div>

          <div class="showcase-stage">
            <div class="showcase-panel is-active" role="tabpanel" id="panel-f1" aria-labelledby="tab-f1">
              <picture>
                <source type="image/webp" srcset="./assets/feature-map-280.webp 280w, ./assets/feature-map-460.webp 460w" sizes="(max-width: 860px) 240px, 330px" />
                <img src="./assets/feature-map-460.png" srcset="./assets/feature-map-280.png 280w, ./assets/feature-map-460.png 460w" sizes="(max-width: 860px) 240px, 330px" width="460" height="1024" data-i18n-alt="home.f1Alt" alt="" decoding="async" />
              </picture>
            </div>
            <div class="showcase-panel" role="tabpanel" id="panel-f2" aria-labelledby="tab-f2" hidden>
              <picture>
                <source type="image/webp" srcset="./assets/feature-planning-280.webp 280w, ./assets/feature-planning-560.webp 560w" sizes="(max-width: 860px) 240px, 330px" />
                <img src="./assets/feature-planning-560.png" srcset="./assets/feature-planning-280.png 280w, ./assets/feature-planning-560.png 560w" sizes="(max-width: 860px) 240px, 330px" width="456" height="1024" data-i18n-alt="home.f2Alt" alt="" loading="lazy" decoding="async" />
              </picture>
            </div>
            <div class="showcase-panel" role="tabpanel" id="panel-f3" aria-labelledby="tab-f3" hidden>
              <picture>
                <source type="image/webp" srcset="./assets/feature-media-280.webp 280w, ./assets/feature-media-560.webp 560w" sizes="(max-width: 860px) 240px, 330px" />
                <img src="./assets/feature-media-560.png" srcset="./assets/feature-media-280.png 280w, ./assets/feature-media-560.png 560w" sizes="(max-width: 860px) 240px, 330px" width="456" height="1024" data-i18n-alt="home.f3Alt" alt="" loading="lazy" decoding="async" />
              </picture>
            </div>
            <div class="showcase-panel" role="tabpanel" id="panel-f4" aria-labelledby="tab-f4" hidden>
              <picture>
                <source type="image/webp" srcset="./assets/feature-ai-280.webp 280w, ./assets/feature-ai-560.webp 560w" sizes="(max-width: 860px) 240px, 330px" />
                <img src="./assets/feature-ai-560.png" srcset="./assets/feature-ai-280.png 280w, ./assets/feature-ai-560.png 560w" sizes="(max-width: 860px) 240px, 330px" width="456" height="1024" data-i18n-alt="home.f4Alt" alt="" loading="lazy" decoding="async" />
              </picture>
            </div>
            <div class="showcase-panel" role="tabpanel" id="panel-f5" aria-labelledby="tab-f5" hidden>
              <!-- Real generated brochure: cover + photo gallery shown as a page pair -->
              <div class="showcase-duo">
                <picture>
                  <source type="image/webp" srcset="./assets/feature-pdf-p1-320.webp 320w, ./assets/feature-pdf-p1-640.webp 640w" sizes="(max-width: 860px) 42vw, 283px" />
                  <img src="./assets/feature-pdf-p1-640.png" srcset="./assets/feature-pdf-p1-320.png 320w, ./assets/feature-pdf-p1-640.png 640w" sizes="(max-width: 860px) 42vw, 283px" width="640" height="905" data-i18n-alt="home.f5AltP1" alt="" loading="lazy" decoding="async" />
                </picture>
                <picture>
                  <source type="image/webp" srcset="./assets/feature-pdf-p2-320.webp 320w, ./assets/feature-pdf-p2-640.webp 640w" sizes="(max-width: 860px) 42vw, 283px" />
                  <img src="./assets/feature-pdf-p2-640.png" srcset="./assets/feature-pdf-p2-320.png 320w, ./assets/feature-pdf-p2-640.png 640w" sizes="(max-width: 860px) 42vw, 283px" width="640" height="905" data-i18n-alt="home.f5AltP2" alt="" loading="lazy" decoding="async" />
                </picture>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Plans: Free vs Premium summary, details on the services page -->
    <section class="section plans" aria-label="Plans">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="home.plansTitle"></h2>
          <p data-i18n="home.plansLead"></p>
        </div>
        <div class="plans-grid">
          <article class="plan-card">
            <h3 data-i18n="home.plansFreeTitle"></h3>
            <p data-i18n="home.plansFreeBody"></p>
          </article>
          <article class="plan-card is-premium">
            <h3 data-i18n="home.plansProTitle"></h3>
            <p data-i18n="home.plansProBody"></p>
          </article>
        </div>
        <div class="plans-actions">
          <a class="btn btn-secondary" href="./services/" data-i18n="home.plansCta"></a>
        </div>
      </div>
    </section>

    <!-- Download band: only shown by site.js when storeLinks are configured -->
    <section class="download" id="download-section" hidden>
      <div class="container download-inner">
        <h2 data-i18n="home.downloadTitle"></h2>
        <p data-i18n="home.downloadBody"></p>
        <div class="store-badges" id="download-badges"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script>
    window.MapNotePage = { base: './', active: 'home' };
  </script>
  <script src="./js/site-config.js?v=20260815f"></script>
  <script src="./js/i18n.js?v=20260815f"></script>
  <script src="./js/chrome.js?v=20260815f"></script>
  <script src="./js/site.js?v=20260815f"></script>
</body>
</html>
