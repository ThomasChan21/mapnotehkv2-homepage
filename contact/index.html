<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MapNoteHK — Contact</title>
  <meta name="description" content="Contact MapNoteHK." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/site.css?v=20260829d" />
  <!-- Favicon: IconOnly brand. Absolute /favicon.ico first so tab + omnibox share one URL;
       48×48 PNG for Google Search; ?v= busts hard browser/CDN caches. -->
  <link rel="icon" href="/favicon.ico?v=20260829a" sizes="any" />
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png?v=20260829a" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=20260829a" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png?v=20260829a" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=20260829a" />
  <link rel="manifest" href="/assets/site.webmanifest?v=20260829a" />
</head>
<body>
  <a class="skip-link" href="#main">Skip</a>
  <div id="site-header"></div>

  <main id="main" class="section">
    <div class="container">
      <div class="section-head">
        <h1 data-i18n="contact.title"></h1>
        <p data-i18n="contact.lead"></p>
      </div>

      <div class="contact-layout">
        <!-- Left: support details + partnership card (no street address / map) -->
        <section class="panel">
          <ul class="contact-list">
            <li>
              <span data-i18n="contact.emailLabel"></span>
              <a id="contact-email" href="mailto:support@mapnotehk.com">support@mapnotehk.com</a>
            </li>
            <li>
              <span data-i18n="contact.responseLabel"></span>
              <div data-i18n="contact.responseText"></div>
            </li>
          </ul>

          <!--
            Partnership block — sample pattern: icon, title, email, pill CTA.
            Approach: centered card; CTA opens mailto with a partnership subject.
          -->
          <div class="coop-card">
            <div class="coop-icon" aria-hidden="true">
              <!-- Lucide-style handshake: partnership cue matching sample card -->
              <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                <path d="m11 17 2 2a1 1 0 1 0 3-3" />
                <path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4" />
                <path d="m21 3 1 11h-2" />
                <path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3" />
                <path d="M3 4h8" />
              </svg>
            </div>
            <h3 data-i18n="contact.coopTitle"></h3>
            <a class="coop-email" id="contact-coop-email" href="mailto:support@mapnotehk.com">support@mapnotehk.com</a>
            <a
              class="btn btn-primary coop-cta"
              id="contact-coop-cta"
              href="mailto:support@mapnotehk.com?subject=Business%20partnership"
              data-i18n="contact.coopCta"
            ></a>
          </div>
        </section>

        <section class="panel">
          <h3 data-i18n="contact.formTitle"></h3>
          <form id="contact-form" class="form-stack" novalidate>
            <label>
              <span data-i18n="contact.name"></span>
              <input name="name" type="text" required autocomplete="name" />
            </label>
            <label>
              <span data-i18n="contact.email"></span>
              <input name="email" type="email" required autocomplete="email" />
            </label>
            <label>
              <span data-i18n="contact.message"></span>
              <textarea name="message" required></textarea>
            </label>
            <button class="btn btn-primary" type="submit" data-i18n="contact.submit"></button>
            <p id="contact-form-status" class="form-status" hidden></p>
          </form>
        </section>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script>
    window.MapNotePage = { base: '../', active: 'contact' };
  </script>
  <script src="../js/site-config.js?v=20260829d"></script>
  <script src="../js/i18n.js?v=20260829d"></script>
  <script src="../js/chrome.js?v=20260829a"></script>
  <script src="../js/forms.js?v=20260823a"></script>
  <script src="../js/site.js?v=20260829d"></script>
</body>
</html>
